<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4ef" />
    <meta name="description" content="사진 뭉탱이 — 사진 네 장으로 만드는 2×2 콜라주 편집기" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1d1d'/%3E%3Cpath d='M11 11h18v18H11zm24 0h18v18H35zM11 35h18v18H11zm24 0h18v18H35z' fill='%23f4f4ef'/%3E%3C/svg%3E" />
    <title>사진 뭉탱이 — 4컷 콜라주</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #181b1b;
        --muted: #6c716e;
        --line: #d9dcd8;
        --paper: #f6f6f2;
        --soft: #e9ebe6;
        --accent: #e86844;
        --accent-dark: #b74729;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      }
      
      @font-face {
        font-family: "KimJeongcheolMyoungjo";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/KimjungchulMyungjo-Light.woff2") format("woff2");
        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }
      
      @font-face {
        font-family: "KimJeongcheolMyoungjo";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/KimjungchulMyungjo-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      
      @font-face {
        font-family: "KimJeongcheolMyoungjo";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/KimjungchulMyungjo-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { margin: 0; min-width: 320px; background: var(--soft); color: var(--ink); }
      button, input { font: inherit; }
      button { cursor: pointer; }
      
      .site-header {
        min-height: 74px; padding: 16px clamp(20px, 4vw, 64px); display: flex; align-items: center; gap: 24px;
        background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20;
      }
      .brand { color: var(--ink); text-decoration: none; font-family: Georgia, "Times New Roman", serif; font-weight: 900; font-size: 1.32rem; letter-spacing: .08em; }
      .site-header p { margin: 0; color: var(--muted); font-size: .87rem; }
      .header-upload { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; margin-left: auto; padding: .65rem .85rem; border: 1px solid var(--ink); border-radius: 99px; background: transparent; color: var(--ink); font-size: .8rem; font-weight: 750; cursor: pointer; }
      .download-button { margin-left: 0; padding: .75rem 1.05rem; border: 0; border-radius: 99px; background: var(--ink); color: white; font-size: .9rem; font-weight: 750; transition: transform .18s, opacity .18s, background .18s; }
      .download-button:not(:disabled):hover { background: var(--accent-dark); transform: translateY(-1px); }
      .download-button:disabled { cursor: not-allowed; opacity: .42; }
      
      .workspace { max-width: 1540px; margin: 0 auto; padding: clamp(24px, 4vw, 58px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 470px); gap: clamp(26px, 4vw, 72px); align-items: start; }
      .preview-panel { min-width: 0; position: sticky; top: 108px; }
      .preview-controls { display: grid; grid-template-columns: minmax(0, 220px) minmax(150px, 240px); align-items: end; justify-content: space-between; gap: 16px; margin: 0 auto 14px; }
      .preview-control { min-width: 0; margin: 0; color: var(--muted); font-size: .68rem; font-weight: 750; letter-spacing: .04em; }
      .preview-control select { min-height: 38px; margin: 6px 0 0; padding: .45rem .55rem; font-size: .78rem; }
      .preview-aspect-control { display: flex; align-items: center; gap: 8px; }
      .preview-aspect-control select { flex: 1; margin: 0; }
      .preview-size-control { text-align: right; }
      .preview-size-control output { float: none; margin-left: 6px; }
      .preview-size-control input { margin: 6px 0 0; }
      .eyebrow { display: block; color: var(--accent-dark); font-weight: 800; font-size: .68rem; letter-spacing: .13em; line-height: 1; }
      h1, h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; }
      h1 { margin-top: .45rem; font-size: clamp(2rem, 4vw, 3.4rem); letter-spacing: -.06em; }
      h2 { margin-top: .35rem; font-size: 1.42rem; letter-spacing: -.035em; }
      .preview-hint { max-width: 230px; margin: 0; color: var(--muted); font-size: .83rem; line-height: 1.5; text-align: right; }
      .canvas-wrap { width: 100%; height: min(62vh, 640px); margin: 0 auto; display: flex; align-items: center; justify-content: center; }
      .canvas-stage { position: relative; flex: 0 0 auto; line-height: 0; }
      #collageCanvas { display: block; width: 100%; height: 100%; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; cursor: default; background: #fff; box-shadow: 0 22px 55px rgba(25, 30, 29, .15); }
      #collageCanvas.is-draggable { cursor: grab; }
      #collageCanvas.is-dragging { cursor: grabbing; }
      .preview-boundary-handle { position: absolute; z-index: 3; height: 22px; margin: 0; padding: 0; border: 0; background: transparent; cursor: ns-resize; touch-action: none; transform: translateY(-50%); }
      .preview-boundary-handle::before { content: ""; position: absolute; inset: 50% 0 auto; height: 1px; background: rgba(82, 87, 86, .32); transform: translateY(-50%); transition: height .15s ease, background .15s ease; }
      .preview-boundary-handle::after { display: none; }
      .preview-boundary-handle:hover::before, .preview-boundary-handle.is-dragging::before, .preview-boundary-handle:focus-visible::before { height: 2px; background: rgba(82, 87, 86, .7); }
      .preview-boundary-handle:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      .preview-footer { width: min(100%, 640px); margin: 12px auto 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .canvas-caption { margin: 0; color: var(--muted); font-size: .74rem; letter-spacing: .04em; }
      .reset-boundaries { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 99px; padding: .42rem .7rem; background: var(--paper); color: var(--ink); font-size: .72rem; font-weight: 750; }
      .reset-boundaries:hover { border-color: var(--accent); color: var(--accent-dark); }
      
      .controls { background: transparent; border: 0; box-shadow: none; }
      .control-section { padding: 26px; border-bottom: 1px solid var(--line); }
      .control-section:last-child { border-bottom: 0; }
      .control-carousel { min-width: 0; }
      .control-card { display: none; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 14px 45px rgba(31,37,35,.06); }
      .control-card.is-active { display: block; }
      .control-card.control-section { border-bottom: 1px solid var(--line); }
      .card-navigation { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
      .card-navigation button { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; background: var(--paper); color: var(--ink); font-size: 1.15rem; line-height: 1; }
      .card-navigation button:hover { border-color: var(--accent); color: var(--accent-dark); }
      .card-position { margin: 0; color: var(--muted); font-size: .72rem; font-weight: 750; letter-spacing: .06em; }
      .section-heading { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
      .count-badge { min-width: 45px; padding: .34rem .45rem; border-radius: 99px; background: var(--ink); color: white; font-size: .7rem; text-align: center; font-weight: 750; }
      label { display: block; color: #303534; font-size: .78rem; font-weight: 730; letter-spacing: .01em; }
      input[type="text"], input[type="date"], select { width: 100%; min-height: 43px; margin: 7px 0 15px; padding: .65rem .75rem; border: 1px solid #cbd0cb; border-radius: 7px; color: var(--ink); background: white; outline: none; font-size: .94rem; }
      input[type="text"]:focus, input[type="date"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,104,68,.14); }
      input[type="range"] { width: 100%; margin: 10px 0 2px; accent-color: var(--accent); }
      input[type="color"] { width: 42px; height: 32px; padding: 2px; border: 1px solid #cbd0cb; border-radius: 6px; background: white; cursor: pointer; }
      output { float: right; color: var(--muted); font-size: .72rem; font-weight: 650; }
      
      .primary-upload { display: flex; align-items: baseline; justify-content: space-between; min-height: 46px; padding: .7rem .85rem; border-radius: 7px; background: var(--ink); color: white; cursor: pointer; }
      .primary-upload span { color: #cdd0cf; font-size: .7rem; font-weight: 650; }
      #photoUpload { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
      .field-note { margin: 8px 0 0; color: var(--muted); font-size: .74rem; line-height: 1.45; }
      .field-note.is-warning { color: var(--accent-dark); font-weight: 700; }
      .photo-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
      .photo-slot { min-width: 0; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: #fff; transition: border-color .15s, box-shadow .15s, opacity .15s, transform .15s; }
      .photo-slot.is-selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(232,104,68,.16); }
      .photo-slot.is-dragging { opacity: .46; transform: scale(.97); }
      .photo-slot.is-drop-target { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(232,104,68,.28); }
      .slot-main, .slot-main * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; }
      .slot-main { width: 100%; min-height: 39px; display: flex; gap: 7px; align-items: center; padding: .45rem .55rem; border: 0; background: transparent; color: var(--ink); text-align: left; touch-action: none; -webkit-tap-highlight-color: transparent; }
      .slot-number { color: var(--accent-dark); font-size: .72rem; font-weight: 800; }
      .slot-label { min-width: 0; overflow: hidden; color: var(--muted); font-size: .72rem; text-overflow: ellipsis; white-space: nowrap; }
      .photo-slot.has-image .slot-label { color: var(--ink); font-weight: 700; }
      .slot-actions { display: none; border-top: 1px solid var(--line); }
      .photo-slot.has-image .slot-actions { display: flex; }
      .replace-label, .remove-slot { flex: 1; min-height: 31px; border: 0; background: #f2f3ef; color: #3a3e3c; text-align: center; font-size: .68rem; line-height: 31px; cursor: pointer; }
      .replace-label { border-right: 1px solid var(--line); }
      .replace-label input { position: absolute; width: 1px; height: 1px; opacity: 0; }
      .remove-slot { max-width: 36px; font-size: 1.2rem; line-height: 27px; }
      .crop-controls { margin-top: 16px; padding-top: 16px; border-top: 1px dashed #d2d5d0; }
      .crop-controls input:disabled { opacity: .4; }
      .field-row { display: flex; justify-content: space-between; align-items: baseline; }
      .field-row output { float: none; }
      
      .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 0 0 15px; padding: 4px; border-radius: 8px; background: #e6e8e3; }
      .mode-button { min-height: 31px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: .74rem; font-weight: 750; }
      .mode-button.is-active { background: white; color: var(--ink); box-shadow: 0 1px 3px rgba(25,30,29,.1); }
      .color-row { min-height: 44px; display: flex; align-items: center; justify-content: space-between; }
      .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .color-field { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .palette-label { display: block; margin: 0 0 10px; color: #303534; font-size: .78rem; font-weight: 730; letter-spacing: .01em; }
      .frame-palette { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
      .palette-swatch { position: relative; aspect-ratio: 1; min-height: 30px; padding: 0; border: 2px solid transparent; border-radius: 50%; background: var(--swatch); box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; }
      .palette-swatch:hover { transform: scale(1.07); }
      .palette-swatch.is-selected { border-color: var(--ink); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--ink); }
      .palette-swatch.is-selected::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: white; font-size: .85rem; font-weight: 900; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
      .gradient-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
      .gradient-targets { display: inline-flex; gap: 4px; padding: 4px; border-radius: 8px; background: #e6e8e3; }
      .gradient-target { min-height: 30px; padding: .38rem .6rem; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: .72rem; font-weight: 750; }
      .gradient-target.is-active { background: white; color: var(--ink); box-shadow: 0 1px 3px rgba(25,30,29,.1); }
      .random-gradient { flex: 0 0 auto; min-height: 34px; padding: .45rem .65rem; border: 1px solid var(--line); border-radius: 7px; background: white; color: var(--ink); font-size: .72rem; font-weight: 750; }
      .random-gradient:hover { border-color: var(--accent); color: var(--accent-dark); }
      .preview-swap-notice { width: fit-content; max-width: min(100%, 640px); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 7px; margin: 10px auto 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font-size: .72rem; font-weight: 750; line-height: 1.2; box-shadow: 0 5px 16px rgba(25,30,29,.08); }
      .preview-swap-notice button { min-height: 27px; padding: .3rem .52rem; border: 1px solid var(--line); border-radius: 99px; background: white; color: var(--ink); font-size: .68rem; font-weight: 750; }
      .preview-swap-notice .preview-delete { border-color: rgba(183,71,41,.35); color: var(--accent-dark); }
      .preview-slot-upload { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
      .gradient-controls > label { display: block; margin-top: 17px; }
      .gradient-controls .two-column > label:not(.color-field) { font-size: .74rem; }
      .spacing-controls { margin-top: 18px; }
      .range-field { display: block; margin-top: 18px; }
      .column-split-controls { margin-top: 18px; }
      .column-split-controls label { font-size: .74rem; }
      .ratio-note { margin: -7px 0 16px; }
      .title-style { margin-top: 2px; align-items: center; }
      .title-weights { margin-top: -2px; }
      .title-weights select { min-height: 86px; margin-bottom: 0; font-size: .78rem; }
      .title-style > label:not(.color-field) { font-size: .74rem; }
      .switch-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      .switch-row input { width: 38px; height: 21px; accent-color: var(--accent); }
      .timestamp-toggle { display: inline-flex; align-items: center; margin-top: 5px; }
      .timestamp-toggle input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
      .timestamp-mode { margin-bottom: 13px; }
      .radio-row { display: flex; gap: 18px; margin-top: 2px; }
      .radio-row label { display: flex; align-items: center; gap: 5px; font-size: .77rem; font-weight: 650; }
      .radio-row input { accent-color: var(--accent); }
      #dateField { min-width: 0; }
      #dateField input { min-width: 0; max-width: 100%; }
      
      @media (max-width: 960px) {
        .workspace { grid-template-columns: 1fr; max-width: 820px; }
        .preview-panel { position: static; }
        .canvas-wrap { width: min(100%, 680px); height: auto; }
        .preview-footer { width: min(100%, 680px); }
      }
      @media (hover: none) and (pointer: coarse) {
        .preview-boundary-handle { height: 48px; -webkit-tap-highlight-color: transparent; }
        .preview-boundary-handle::after { content: "↕"; position: absolute; top: 50%; left: 50%; display: grid; width: 18px; height: 18px; place-items: center; border-radius: 50%; background: rgba(82, 87, 86, .28); color: rgba(255, 255, 255, .9); font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; line-height: 1; pointer-events: none; transform: translate(-50%, -50%); transition: background .15s ease, transform .15s ease; }
        .preview-boundary-handle.is-dragging::after { background: rgba(82, 87, 86, .55); transform: translate(-50%, -50%) scale(1.08); }
      }
      @media (max-width: 560px) {
        #collageCanvas { -webkit-tap-highlight-color: transparent; overscroll-behavior: contain; }
        .site-header { min-height: 66px; gap: 8px; padding: 12px 16px; }
        .site-header p { display: none; }
        .brand { font-size: 1.06rem; letter-spacing: .03em; }
        .header-upload { min-height: 36px; padding: .5rem .58rem; font-size: .72rem; }
        .download-button { padding: .6rem .68rem; font-size: .76rem; }
        .workspace { padding: 22px 15px 38px; gap: 28px; }
        .preview-controls { width: 80vw; grid-template-columns: minmax(0, 1fr) minmax(105px, 42%); gap: 12px; }
        .preview-control select { font-size: 16px; }
        .canvas-wrap, .preview-footer { width: min(80vw, 680px); }
        .preview-swap-notice { width: min(80vw, 680px); font-size: .68rem; }
        #dateField { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; }
        input[type="text"], input[type="date"], select { font-size: 16px; }
        #dateField input { width: 100%; margin: 0; }
        .control-section { padding: 22px 18px; }
        .two-column { gap: 12px; }
        .photo-slots { gap: 6px; }
      }
      
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="사진 뭉탱이 홈">사진 뭉탱이</a>
      <p>4장의 순간을 한 장으로</p>
      <label class="header-upload" for="photoUpload">사진 선택하기</label>
      <input id="photoUpload" type="file" accept="image/*" multiple />
      <button id="downloadButton" class="download-button" type="button" disabled>
        PNG 다운로드
      </button>
    </header>

    <main id="top" class="workspace">
      <section class="preview-panel" aria-label="콜라주 미리보기">
        <div class="preview-controls" aria-label="빠른 편집 도구">
          <label class="preview-control preview-aspect-control" for="aspectRatio">비율
            <select id="aspectRatio">
              <option value="square">1:1</option>
              <option value="fourFive">4:5</option>
              <option value="twoThree" selected>2:3</option>
              <option value="nineSixteen">9:16</option>
            </select>
          </label>
          <label class="preview-control preview-size-control" for="titleSize">글자 크기 <output id="titleSizeValue" for="titleSize">52 px</output>
            <input id="titleSize" type="range" min="28" max="90" value="52" />
          </label>
        </div>
        <div class="canvas-wrap">
          <div id="canvasStage" class="canvas-stage">
            <canvas id="collageCanvas" width="1440" height="2160" aria-label="편집 중인 2×2 콜라주"></canvas>
            <button id="previewLeftHandle" class="preview-boundary-handle" type="button" aria-label="왼쪽 열 사진 경계 드래그 핸들"></button>
            <button id="previewRightHandle" class="preview-boundary-handle" type="button" aria-label="오른쪽 열 사진 경계 드래그 핸들"></button>
          </div>
        </div>
        <div id="previewSwapNotice" class="preview-swap-notice" hidden aria-live="polite">
          <span>바꿀 사진을 탭하세요</span>
          <button id="previewReplacePhoto" type="button">사진 교체</button>
          <button id="previewRemovePhoto" class="preview-delete" type="button">사진 삭제</button>
          <button id="cancelPreviewSwap" type="button">취소</button>
        </div>
        <input id="previewSlotUpload" class="preview-slot-upload" type="file" accept="image/*" />
        <div class="preview-footer">
          <p id="canvasCaption" class="canvas-caption">1440 × 2160 px · 2:3 PNG</p>
          <button id="resetBoundaries" class="reset-boundaries" type="button">등분으로 초기화</button>
        </div>
      </section>

      <aside class="controls" aria-label="콜라주 편집 설정">
        <div class="card-navigation" aria-label="설정 카드 탐색">
          <button id="previousCard" type="button" aria-label="이전 설정 카드">←</button>
          <p id="cardPosition" class="card-position" aria-live="polite">1 / 3 · 프레임</p>
          <button id="nextCard" type="button" aria-label="다음 설정 카드">→</button>
        </div>
        <div class="control-carousel">
        <section class="control-section control-card is-active" data-control-card="frame">
          <div class="section-heading">
            <div><span class="eyebrow">01</span><h2>프레임</h2></div>
          </div>
          <div class="segmented" role="group" aria-label="프레임 색상 방식">
            <button class="mode-button is-active" type="button" data-frame-mode="solid">단색</button>
            <button class="mode-button" type="button" data-frame-mode="gradient">그라디언트</button>
          </div>
          <div id="solidControls">
            <span class="palette-label">프레임 색상</span>
            <div id="solidPalette" class="frame-palette" role="group" aria-label="프레임 색상 팔레트"></div>
          </div>
          <div id="gradientControls" class="gradient-controls" hidden>
            <div class="gradient-toolbar">
              <div class="gradient-targets" role="group" aria-label="그라디언트 색상 대상">

    </main>

    <script>
      (() => {
        "use strict";
      
        const SIZE = { width: 1440, height: 2160 };

          square: { height: 1440, label: "1:1" },

          twoThree: { height: 2160, label: "2:3" },
          nineSixteen: { height: 2560, label: "9:16" },

        const FRAME_PALETTE = [
          "#F8F6F1", "#EEE8DF", "#E7D6C6", "#F1C7BE", "#E8B7A6",
          "#D6C5E8", "#BFC8E8", "#B5D7E7", "#B9DDD0", "#CFE3B7",
          "#F3D35B", "#E9AE55", "#D87F5B", "#C35D5D", "#9B6655",
          "#53656A", "#344E5C", "#526B45", "#7C6B98", "#2E3133",
        ];

        offscreen.height = SIZE.height;
        const exportCtx = offscreen.getContext("2d");
      
        const state = {
          activeSlot: null,
          isDragging: false,
          drag: null,
          touchPoints: new Map(),
          pinch: null,
          previewTouch: null,
          previewSwap: null,
          paletteTarget: "colorA",
          cardIndex: 0,
          boundaryDrag: null,
          aspect: "twoThree",
          slots: Array.from({ length: 4 }, () => ({ image: null, name: "", scale: 1, offsetX: 0, offsetY: 0 })),
          frame: { mode: "solid", solid: "#F8F6F1", colorA: "#F1C7BE", colorB: "#B5D7E7", stopA: 0, stopB: 100, angle: 135, padding: 50, verticalPadding: 50, gap: 16, leftTopRatio: 50, rightTopRatio: 50 },
          title: { top: "", bottom: "", topWeight: 400, bottomWeight: 400, color: "#151515", size: 52 },

          photoUpload: $("#photoUpload"),
          solidControls: $("#solidControls"), gradientControls: $("#gradientControls"),
          solidPalette: $("#solidPalette"), gradientPalette: $("#gradientPalette"), randomGradient: $("#randomGradient"), angle: $("#gradientAngle"), angleValue: $("#angleValue"),
          stopA: $("#gradientStopA"), stopB: $("#gradientStopB"), stopAValue: $("#stopAValue"), stopBValue: $("#stopBValue"),
          padding: $("#framePadding"), verticalPadding: $("#verticalPadding"), gap: $("#gridGap"), leftTopRatio: $("#leftTopRatio"), rightTopRatio: $("#rightTopRatio"), paddingValue: $("#paddingValue"), verticalPaddingValue: $("#verticalPaddingValue"), gapValue: $("#gapValue"), leftTopRatioValue: $("#leftTopRatioValue"), rightTopRatioValue: $("#rightTopRatioValue"),
          topTitle: $("#topTitle"), bottomTitle: $("#bottomTitle"), topTitleWeight: $("#topTitleWeight"), bottomTitleWeight: $("#bottomTitleWeight"), titleColor: $("#titleColor"), titleSize: $("#titleSize"), titleSizeValue: $("#titleSizeValue"),
          timestampEnabled: $("#timestampEnabled"), timestampControls: $("#timestampControls"), selectedDate: $("#selectedDate"), dateField: $("#dateField"),
          download: $("#downloadButton"), aspectRatio: $("#aspectRatio"), canvasCaption: $("#canvasCaption"), canvasWrap: $(".canvas-wrap"), canvasStage: $("#canvasStage"), previewLeftHandle: $("#previewLeftHandle"), previewRightHandle: $("#previewRightHandle"), previewSwapNotice: $("#previewSwapNotice"), previewSlotUpload: $("#previewSlotUpload"), previewReplacePhoto: $("#previewReplacePhoto"), previewRemovePhoto: $("#previewRemovePhoto"), cancelPreviewSwap: $("#cancelPreviewSwap"), resetBoundaries: $("#resetBoundaries"), previousCard: $("#previousCard"), nextCard: $("#nextCard"), cardPosition: $("#cardPosition"),
        };

        }
      
        function applyAspect() {

          canvas.height = SIZE.height;

        function updatePreviewStage() {

          els.canvasStage.style.height = `${Math.round(height)}px`;
        }
      
        function positionPreviewHandles() {
          const stageWidth = els.canvasStage.clientWidth;
          const stageHeight = els.canvasStage.clientHeight;
          if (!stageWidth || !stageHeight) return;
          const geometry = layout();
          const setPosition = (handle, topCell) => {
            const x = topCell.x / SIZE.width * stageWidth;
            const y = (topCell.y + topCell.height + state.frame.gap / 2) / SIZE.height * stageHeight;
            const width = topCell.width / SIZE.width * stageWidth;

            handle.style.top = `${y}px`;
            handle.style.width = `${width}px`;
          };
          setPosition(els.previewLeftHandle, geometry.cells[0]);
          setPosition(els.previewRightHandle, geometry.cells[1]);
        }
      
        function syncBoundaryControls() {
          els.leftTopRatio.value = state.frame.leftTopRatio;
          els.rightTopRatio.value = state.frame.rightTopRatio;
          els.leftTopRatioValue.textContent = `${state.frame.leftTopRatio}%`;
          els.rightTopRatioValue.textContent = `${state.frame.rightTopRatio}%`;
        }

        function updateFrameOutputs() {
          els.angleValue.textContent = `${state.frame.angle}°`;
          els.stopAValue.textContent = `${state.frame.stopA}%`;
          els.stopBValue.textContent = `${state.frame.stopB}%`;
          els.paddingValue.textContent = `${state.frame.padding} px`;
          els.verticalPaddingValue.textContent = `${state.frame.verticalPadding} px`;
          els.gapValue.textContent = `${state.frame.gap} px`;
        }

        function updateCardCarousel() {
          const cards = Array.from(document.querySelectorAll("[data-control-card]"));
          if (!cards.length) return;
          state.cardIndex = (state.cardIndex + cards.length) % cards.length;
          cards.forEach((card, index) => card.classList.toggle("is-active", index === state.cardIndex));
          const title = cards[state.cardIndex].querySelector("h2")?.textContent || "설정";
          els.cardPosition.textContent = `${state.cardIndex + 1} / ${cards.length} · ${title}`;
        }

        function moveCard(direction) {
          state.cardIndex += direction;
          updateCardCarousel();
        }

        function buildPalette(container, selectedColor, onSelect) {
          container.innerHTML = "";
          FRAME_PALETTE.forEach((color) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "palette-swatch";
            button.style.setProperty("--swatch", color);
            button.classList.toggle("is-selected", color.toLowerCase() === selectedColor.toLowerCase());
            button.setAttribute("aria-label", `${color} 선택`);
            button.setAttribute("aria-pressed", String(color.toLowerCase() === selectedColor.toLowerCase()));
            button.addEventListener("click", () => onSelect(color));
            container.append(button);
          });
        }

        function updatePaletteUI() {
          buildPalette(els.solidPalette, state.frame.solid, (color) => {
            state.frame.solid = color;
            updatePaletteUI();
            refreshCanvas();
          });
          buildPalette(els.gradientPalette, state.frame[state.paletteTarget], (color) => {
            state.frame[state.paletteTarget] = color;
            updatePaletteUI();
            refreshCanvas();
          });
          document.querySelectorAll("[data-gradient-target]").forEach((button) => {
            const active = button.dataset.gradientTarget === state.paletteTarget;
            button.classList.toggle("is-active", active);
            button.setAttribute("aria-pressed", String(active));
          });
        }

        function randomizeGradient() {
          const firstIndex = Math.floor(Math.random() * FRAME_PALETTE.length);
          let secondIndex = Math.floor(Math.random() * (FRAME_PALETTE.length - 1));
          if (secondIndex >= firstIndex) secondIndex += 1;
          state.frame.colorA = FRAME_PALETTE[firstIndex];
          state.frame.colorB = FRAME_PALETTE[secondIndex];
          state.frame.stopA = Math.floor(Math.random() * 41);
          state.frame.stopB = 60 + Math.floor(Math.random() * 41);
          state.frame.angle = Math.floor(Math.random() * 360);
          els.angle.value = state.frame.angle;
          els.stopA.value = state.frame.stopA;
          els.stopB.value = state.frame.stopB;
          updateFrameOutputs();
          updatePaletteUI();
          refreshCanvas();
        }
      
        function formatNow(date = new Date()) {
          const two = (value) => String(value).padStart(2, "0");
          return `${date.getFullYear()}.${two(date.getMonth() + 1)}.${two(date.getDate())} ${two(date.getHours())}:${two(date.getMinutes())}`;
        }
      
        function countImages() { return state.slots.filter((slot) => slot.image).length; }
      
        function makeFrameFill(context) {
          if (state.frame.mode === "solid") return state.frame.solid;
          const radians = (state.frame.angle - 90) * Math.PI / 180;
          const cx = SIZE.width / 2, cy = SIZE.height / 2;
          const distance = Math.sqrt(SIZE.width ** 2 + SIZE.height ** 2) / 2;
          const gradient = context.createLinearGradient(cx - Math.cos(radians) * distance, cy - Math.sin(radians) * distance, cx + Math.cos(radians) * distance, cy + Math.sin(radians) * distance);
          // Canvas gradients require color stops in ascending order.  Keeping the
          // colors attached to their own controls still makes crossed stop handles
          // useful, while avoiding a rendering exception.
          const firstStop = Math.min(state.frame.stopA, state.frame.stopB) / 100;
          const secondStop = Math.max(state.frame.stopA, state.frame.stopB) / 100;
          gradient.addColorStop(firstStop, state.frame.colorA);
          gradient.addColorStop(secondStop, state.frame.colorB);
          return gradient;
        }
      
        function titleBandHeight(text) {
          return text.trim() ? Math.max(125, state.title.size * 2.5) : 0;
        }
      
        function layout() {
          const padX = state.frame.padding;
          const padY = state.frame.verticalPadding;
          const gap = state.frame.gap;
          const topBand = titleBandHeight(state.title.top);
          const bottomBand = titleBandHeight(state.title.bottom);
          const x = padX;
          const y = padY + topBand;
          const width = SIZE.width - padX * 2;
          const height = SIZE.height - padY * 2 - topBand - bottomBand;
          const cellW = (width - gap) / 2;
          const usableColumnHeight = height - gap;
          const leftTopHeight = usableColumnHeight * state.frame.leftTopRatio / 100;
          const rightTopHeight = usableColumnHeight * state.frame.rightTopRatio / 100;
          const leftBottomHeight = usableColumnHeight - leftTopHeight;
          const rightBottomHeight = usableColumnHeight - rightTopHeight;
          return {
            padX, padY, topBand, bottomBand,
            cells: [
              { x, y, width: cellW, height: leftTopHeight },
              { x: x + cellW + gap, y, width: cellW, height: rightTopHeight },
              { x, y: y + leftTopHeight + gap, width: cellW, height: leftBottomHeight },
              { x: x + cellW + gap, y: y + rightTopHeight + gap, width: cellW, height: rightBottomHeight },
            ],
          };
        }
      
        function clampSlot(slot, cell) {
          if (!slot.image) return;
          const image = slot.image;
          const scale = Math.max(cell.width / image.naturalWidth, cell.height / image.naturalHeight) * slot.scale;
          const overflowX = Math.max(0, (image.naturalWidth * scale - cell.width) / 2);
          const overflowY = Math.max(0, (image.naturalHeight * scale - cell.height) / 2);
          slot.offsetX = Math.max(-overflowX, Math.min(overflowX, slot.offsetX));
          slot.offsetY = Math.max(-overflowY, Math.min(overflowY, slot.offsetY));
        }
      
        function drawImage(context, slot, cell) {
          context.save();
          context.beginPath();
          context.rect(cell.x, cell.y, cell.width, cell.height);
          context.clip();
          if (!slot.image) {
            context.fillStyle = "rgba(255,255,255,.55)";
            context.fillRect(cell.x, cell.y, cell.width, cell.height);
            context.fillStyle = "rgba(21,21,21,.38)";
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.font = "700 27px system-ui, sans-serif";
            context.fillText("PHOTO", cell.x + cell.width / 2, cell.y + cell.height / 2);
            context.restore();
            return;
          }
          clampSlot(slot, cell);
          const baseScale = Math.max(cell.width / slot.image.naturalWidth, cell.height / slot.image.naturalHeight);
          const scaled = baseScale * slot.scale;
          const width = slot.image.naturalWidth * scaled;
          const height = slot.image.naturalHeight * scaled;
          const x = cell.x + (cell.width - width) / 2 + slot.offsetX;
          const y = cell.y + (cell.height - height) / 2 + slot.offsetY;
          context.drawImage(slot.image, x, y, width, height);
          context.restore();
        }
      
        function fitText(context, text, maxWidth, initialSize, weight) {
          let size = initialSize;
          context.font = `${weight} ${size}px KimJeongcheolMyoungjo, Georgia, 'Times New Roman', serif`;

            context.font = `${weight} ${size}px KimJeongcheolMyoungjo, Georgia, 'Times New Roman', serif`;
          }
        }
      
        function drawTitle(context, text, y, weight) {

        function stampText(now = new Date()) {

        }
      
        function render(context, showSelection = true, now = new Date()) {

          // rather than being centred only in the title band beside the photo grid.
          drawTitle(context, state.title.top, (geometry.padY + geometry.topBand) / 2, state.title.topWeight);

            context.save();
            context.fillStyle = state.title.color;

            context.fillText(stamp, x, SIZE.height - geometry.padY / 2);
            context.restore();
          }
          if (showSelection && state.previewSwap) {

            context.lineWidth = 8;
            context.strokeStyle = "#e86844";
            context.strokeRect(cell.x + 4, cell.y + 4, cell.width - 8, cell.height - 8);
            context.restore();
          }
        }

          render(ctx, true);

        }
      
        function updateSlotsUI() {

        }
      
        function updateActiveControls() {
          // 사진 확대와 위치 조절은 미리보기의 핀치·드래그 제스처로 직접 수행합니다.
        }
      
        function selectSlot(index) {
          state.activeSlot = index;
          updateSlotsUI();
          updateActiveControls();
          refreshCanvas();
        }
      
        function loadFileIntoSlot(file, index) {
          if (!file.type.startsWith("image/")) return;
          const reader = new FileReader();
          reader.onload = () => {
            const image = new Image();
            image.onload = () => {
              state.slots[index] = { image, name: file.name, scale: 1, offsetX: 0, offsetY: 0 };

            };
            image.src = reader.result;
          };
          reader.readAsDataURL(file);
        }
      
        function removeSlot(index) {
          state.slots[index] = { image: null, name: "", scale: 1, offsetX: 0, offsetY: 0 };
          if (state.activeSlot === index) state.activeSlot = null;
          updateSlotsUI();
          updateActiveControls();
          refreshCanvas();
        }
      
        function handleBulkUpload(files) {
          const valid = [...files].filter((file) => file.type.startsWith("image/")).slice(0, 4);

          els.photoUpload.value = "";
        }
      
        function swapSlots(first, second) {
          if (first === second || !state.slots[first].image) return;

          updateActiveControls();
          refreshCanvas();
        }
      
        function coordinateForPointer(event) {

          return { x: (event.clientX - rect.left) * SIZE.width / rect.width, y: (event.clientY - rect.top) * SIZE.height / rect.height };
        }
      
        function slotAt(point) {
          return layout().cells.findIndex((cell) => point.x >= cell.x && point.x <= cell.x + cell.width && point.y >= cell.y && point.y <= cell.y + cell.height);
        }

          const touch = state.previewTouch;

        }

        function exitPreviewSwap() {
          state.previewSwap = null;
          els.previewSwapNotice.hidden = true;
          refreshCanvas();
        }

        function replacePreviewSlot() {
          if (!state.previewSwap) return;
          const source = state.previewSwap.source;
          exitPreviewSwap();
          els.previewSlotUpload.value = "";
          els.previewSlotUpload.dataset.slotIndex = String(source);
          els.previewSlotUpload.click();
        }

        function removePreviewSlot() {
          if (!state.previewSwap) return;
          const source = state.previewSwap.source;
          state.previewSwap = null;
          els.previewSwapNotice.hidden = true;
          removeSlot(source);
        }

        function enterPreviewSwap(source) {
          clearPreviewTouch();
          state.isDragging = false;
          state.drag = null;
          canvas.classList.remove("is-dragging");
          state.previewSwap = { source };
          els.previewSwapNotice.hidden = false;
          refreshCanvas();
        }

        function beginCropDrag(event, index, point) {
          if (!state.slots[index].image) return;
          state.isDragging = true;
          state.drag = { pointerId: event.pointerId, x: point.x, y: point.y, offsetX: state.slots[index].offsetX, offsetY: state.slots[index].offsetY };
          canvas.classList.add("is-dragging");
        }
      
        function startDrag(event) {
          if (event.pointerType === "touch") {
            state.touchPoints.set(event.pointerId, { x: event.clientX, y: event.clientY });
            const point = coordinateForPointer(event);
            const index = slotAt(point);
            if (state.previewSwap) {
              event.preventDefault();
              if (index === state.previewSwap.source || index < 0 || !state.slots[index].image) {
                exitPreviewSwap();
              } else {
                const source = state.previewSwap.source;
                swapSlots(source, index);
                exitPreviewSwap();
              }
              return;
            }
            if (state.touchPoints.size === 2 && state.activeSlot !== null && state.slots[state.activeSlot].image) {
              clearPreviewTouch();
              const points = Array.from(state.touchPoints.entries());
              const startDistance = Math.hypot(points[1][1].x - points[0][1].x, points[1][1].y - points[0][1].y);
              if (startDistance > 0) {
                state.isDragging = false;
                state.drag = null;
                canvas.classList.remove("is-dragging");
                state.pinch = { ids: new Set(points.map(([id]) => id)), startDistance, startScale: state.slots[state.activeSlot].scale };
                canvas.setPointerCapture(event.pointerId);
                event.preventDefault();
                return;
              }
            }
            if (index < 0) return;
            selectSlot(index);
            if (!state.slots[index].image) return;
            event.preventDefault();
            canvas.setPointerCapture(event.pointerId);
            const touch = { pointerId: event.pointerId, index, point, startX: event.clientX, startY: event.clientY, timer: null };
            touch.timer = window.setTimeout(() => {
              if (state.previewTouch === touch && !state.pinch) enterPreviewSwap(index);
            }, 450);
            state.previewTouch = touch;
            return;
          }
          if (state.pinch) return;
          const point = coordinateForPointer(event);
          const index = slotAt(point);
          if (index < 0) return;
          selectSlot(index);
          if (!state.slots[index].image) return;
          event.preventDefault();
          canvas.setPointerCapture(event.pointerId);
          beginCropDrag(event, index, point);
        }
      
        function moveDrag(event) {
          if (event.pointerType === "touch" && state.touchPoints.has(event.pointerId)) {
            state.touchPoints.set(event.pointerId, { x: event.clientX, y: event.clientY });
            if (state.pinch?.ids.has(event.pointerId) && state.activeSlot !== null) {
              const points = Array.from(state.touchPoints.entries()).filter(([id]) => state.pinch.ids.has(id));
              if (points.length === 2) {
                const currentDistance = Math.hypot(points[1][1].x - points[0][1].x, points[1][1].y - points[0][1].y);
                const slot = state.slots[state.activeSlot];
                slot.scale = Math.max(1, Math.min(3, state.pinch.startScale * currentDistance / state.pinch.startDistance));
                clampSlot(slot, layout().cells[state.activeSlot]);
                refreshCanvas();
              }
              event.preventDefault();
              return;
            }
            const pendingTouch = state.previewTouch;
            if (pendingTouch?.pointerId === event.pointerId) {
              const distance = Math.hypot(event.clientX - pendingTouch.startX, event.clientY - pendingTouch.startY);
              if (distance <= 10) return;
              clearPreviewTouch(event.pointerId);
              beginCropDrag(event, pendingTouch.index, pendingTouch.point);
            }
          }
          if (!state.isDragging || event.pointerId !== state.drag.pointerId || state.activeSlot === null) return;
          const point = coordinateForPointer(event);
          const slot = state.slots[state.activeSlot];
          slot.offsetX = state.drag.offsetX + point.x - state.drag.x;
          slot.offsetY = state.drag.offsetY + point.y - state.drag.y;
          clampSlot(slot, layout().cells[state.activeSlot]);
          refreshCanvas();
        }
      
        function endDrag(event) {
          if (event.pointerType === "touch") {
            state.touchPoints.delete(event.pointerId);
            if (state.pinch?.ids.has(event.pointerId)) state.pinch = null;
            clearPreviewTouch(event.pointerId);
          }
          if (!state.isDragging || event.pointerId !== state.drag.pointerId) return;
          state.isDragging = false;
          state.drag = null;
          canvas.classList.remove("is-dragging");
        }
      
        function startBoundaryDrag(event, column) {
          event.preventDefault();
          const handle = event.currentTarget;
          handle.setPointerCapture(event.pointerId);
          state.boundaryDrag = { pointerId: event.pointerId, column, handle };
          handle.classList.add("is-dragging");
        }
      
        function moveBoundaryDrag(event) {
          const drag = state.boundaryDrag;
          if (!drag || drag.pointerId !== event.pointerId) return;
          event.preventDefault();
          const point = coordinateForPointer(event);
          const geometry = layout();
          const topCell = drag.column === "left" ? geometry.cells[0] : geometry.cells[1];
          const bottomCell = drag.column === "left" ? geometry.cells[2] : geometry.cells[3];
          const usableHeight = topCell.height + bottomCell.height;
          const ratio = (point.y - topCell.y - state.frame.gap / 2) / usableHeight * 100;
          const key = drag.column === "left" ? "leftTopRatio" : "rightTopRatio";
          state.frame[key] = Math.max(20, Math.min(80, ratio));
          syncBoundaryControls();
          refreshCanvas();
        }
      
        function endBoundaryDrag(event) {
          const drag = state.boundaryDrag;
          if (!drag || drag.pointerId !== event.pointerId) return;
          drag.handle.classList.remove("is-dragging");
          state.boundaryDrag = null;
        }
      
        function bindUI() {
          els.photoUpload.addEventListener("change", (event) => handleBulkUpload(event.target.files));
          els.aspectRatio.addEventListener("change", () => {
            state.aspect = els.aspectRatio.value;
            applyAspect();
            refreshCanvas();
          });
          els.previousCard.addEventListener("click", () => moveCard(-1));
          els.nextCard.addEventListener("click", () => moveCard(1));
          document.querySelectorAll("[data-frame-mode]").forEach((button) => button.addEventListener("click", () => {
            state.frame.mode = button.dataset.frameMode;
            document.querySelectorAll("[data-frame-mode]").forEach((item) => item.classList.toggle("is-active", item === button));
            els.solidControls.hidden = state.frame.mode !== "solid";
            els.gradientControls.hidden = state.frame.mode !== "gradient";
            refreshCanvas();
          }));
          document.querySelectorAll("[data-gradient-target]").forEach((button) => button.addEventListener("click", () => {
            state.paletteTarget = button.dataset.gradientTarget;
            updatePaletteUI();
          }));
          els.randomGradient.addEventListener("click", randomizeGradient);
          const frameBindings = [
            [els.angle, "angle"], [els.stopA, "stopA"], [els.stopB, "stopB"], [els.padding, "padding"], [els.verticalPadding, "verticalPadding"], [els.gap, "gap"], [els.leftTopRatio, "leftTopRatio"], [els.rightTopRatio, "rightTopRatio"],
          ];
          frameBindings.forEach(([input, key]) => input.addEventListener("input", () => {
            state.frame[key] = input.type === "range" ? Number(input.value) : input.value;
            updateFrameOutputs();
            syncBoundaryControls();
            refreshCanvas();
          }));
          [[els.previewLeftHandle, "left"], [els.previewRightHandle, "right"]].forEach(([handle, column]) => {
            handle.addEventListener("pointerdown", (event) => startBoundaryDrag(event, column));
            handle.addEventListener("pointermove", moveBoundaryDrag);
            handle.addEventListener("pointerup", endBoundaryDrag);
            handle.addEventListener("pointercancel", endBoundaryDrag);
          });
          els.resetBoundaries.addEventListener("click", () => {
            state.frame.leftTopRatio = 50;
            state.frame.rightTopRatio = 50;
            syncBoundaryControls();
            refreshCanvas();
          });
          els.cancelPreviewSwap.addEventListener("click", exitPreviewSwap);
          els.previewReplacePhoto.addEventListener("click", replacePreviewSlot);
          els.previewRemovePhoto.addEventListener("click", removePreviewSlot);
          els.previewSlotUpload.addEventListener("change", (event) => {
            const [file] = event.target.files;
            const index = Number(event.target.dataset.slotIndex);
            if (file && Number.isInteger(index)) loadFileIntoSlot(file, index);
            event.target.value = "";
            delete event.target.dataset.slotIndex;
          });
          [els.topTitle, els.bottomTitle].forEach((input) => input.addEventListener("input", () => {
            state.title.top = els.topTitle.value;
            state.title.bottom = els.bottomTitle.value;
            refreshCanvas();
          }));
          els.topTitleWeight.addEventListener("change", () => { state.title.topWeight = Number(els.topTitleWeight.value); refreshCanvas(); });
          els.bottomTitleWeight.addEventListener("change", () => { state.title.bottomWeight = Number(els.bottomTitleWeight.value); refreshCanvas(); });
          els.titleColor.addEventListener("input", () => { state.title.color = els.titleColor.value; refreshCanvas(); });
          els.titleSize.addEventListener("input", () => { state.title.size = Number(els.titleSize.value); els.titleSizeValue.textContent = `${state.title.size} px`; refreshCanvas(); });
          els.timestampEnabled.addEventListener("change", () => { state.timestamp.enabled = els.timestampEnabled.checked; els.timestampControls.hidden = !state.timestamp.enabled; refreshCanvas(); });
          document.querySelectorAll("[data-timestamp-mode]").forEach((button) => button.addEventListener("click", () => {
            state.timestamp.mode = button.dataset.timestampMode;
            document.querySelectorAll("[data-timestamp-mode]").forEach((item) => item.classList.toggle("is-active", item === button));
            els.dateField.hidden = state.timestamp.mode !== "date";
            refreshCanvas();
          }));
          els.selectedDate.addEventListener("input", () => { state.timestamp.date = els.selectedDate.value; refreshCanvas(); });
          document.querySelectorAll("input[name='timestampPosition']").forEach((input) => input.addEventListener("change", () => { state.timestamp.position = input.value; refreshCanvas(); }));
          canvas.addEventListener("pointerdown", startDrag);
          canvas.addEventListener("pointermove", moveDrag);
          canvas.addEventListener("pointerup", endDrag);
          canvas.addEventListener("pointercancel", endDrag);
          ["gesturestart", "gesturechange", "gestureend"].forEach((type) => {
            canvas.addEventListener(type, (event) => event.preventDefault(), { passive: false });
          });
          els.download.addEventListener("click", downloadPng);
        }
      
        function downloadPng() {
          if (countImages() !== 4) return;
          const downloadedAt = new Date();
          render(exportCtx, false, downloadedAt);
          offscreen.toBlob((blob) => {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            const twoDigits = (value) => String(value).padStart(2, "0");
            const date = `${downloadedAt.getFullYear()}${twoDigits(downloadedAt.getMonth() + 1)}${twoDigits(downloadedAt.getDate())}`;
            const time = `${twoDigits(downloadedAt.getHours())}${twoDigits(downloadedAt.getMinutes())}${twoDigits(downloadedAt.getSeconds())}`;
            link.download = `사진 뭉탱이_${date}_${time}.png`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 500);
          }, "image/png");
        }
      
        els.selectedDate.value = dateForInput();
        state.timestamp.date = els.selectedDate.value;
        bindUI();
        applyAspect();
        updateFrameOutputs();
        updatePaletteUI();
        updateCardCarousel();
        syncBoundaryControls();
        updateSlotsUI();
        updateActiveControls();
        refreshCanvas();
        window.addEventListener("resize", () => {
          updatePreviewStage();
          refreshCanvas();
        });
        if (document.fonts) {
          Promise.all([
            document.fonts.load("300 52px KimJeongcheolMyoungjo"),
            document.fonts.load("400 52px KimJeongcheolMyoungjo"),
            document.fonts.load("700 52px KimJeongcheolMyoungjo"),
          ]).then(refreshCanvas).catch(() => {});
        }
        setInterval(() => { if (state.timestamp.enabled && state.timestamp.mode === "now") refreshCanvas(); }, 30_000);
      })();
      
    </script>
  </body>
</html>
